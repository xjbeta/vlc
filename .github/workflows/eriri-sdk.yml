# Build the Eriri VLC macOS SDK (one libvlc.framework holding every plugin) on
# the eriri-sdk branch.
#
# Produces the layout the app consumes at Eriri/vlc-macos-sdk:
#   <workspace>/build-dir/vlc-macosx-aarch64/{bin,include,lib,share}
# where lib/ carries libvlc.framework instead of a plugin directory.
#
# It drives VLC's own Apple helper in its *static* mode:
#   extras/package/apple/build.sh --arch=aarch64 --sdk=macosx
# Without --enable-shared the script configures --disable-shared --enable-static,
# merges every plugin (and its static dependencies) into
# lib/vlc/libvlc_static_modules.a, and then folds that together with libvlc.a,
# libvlccore.a and the contribs into lib/libvlc-full-static.a. This is the shape
# VLCKit ships, and it is what lets the app map one file at startup instead of
# ~380 plugin dylibs.
#
# eriri/make-vlc-framework.sh then links libvlc-full-static.a into
# lib/libvlc.framework, which exposes VLC's C API directly (Headers/vlc/*.h and
# a modulemap for `import libvlc`).
#
# Deliberately not used: -Wl,-no_compact_unwind. On arm64 that strips both
# __unwind_info and __eh_frame, so a C++ exception thrown inside a plugin can no
# longer unwind into its handler (__cxa_throw -> failed_throw -> std::terminate).
# The static archive links with the compact unwind table intact, so plugin code
# that throws and catches (medialibrary, for one) behaves.
#
# Eriri patches (e.g. the samplebufferdisplay black-bars fix) live as mail
# patches in patches/ and are applied to the tree before building, so the
# branch itself stays a clean copy of upstream.

name: Build VLC macOS SDK (eriri-sdk)

# Manual only: run from the Actions tab ("Run workflow") on any branch/ref.
on:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # VLC normalises aarch64 -> arm64, so build/install dirs are arm64.
  ARCH: arm64
  SDK: macosx
  SDK_DIR: vlc-macosx-arm64
  JOB_NAME: vlc-macosx-sdk

jobs:
  build-sdk:
    name: Build macOS SDK (shared, ${{ github.ref_name }})
    runs-on: macos-26
    # libvlc + contrib compilation is very slow on a cold cache.
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        shell: zsh {0}
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Resolve revision
        id: rev
        shell: zsh {0}
        run: |
          echo "sha=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building $(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)"

      # The branch stays a clean copy of upstream: Eriri changes live as mail
      # patches in patches/ and are applied here, so rebasing on a newer
      # upstream never conflicts with our own source edits.
      - name: Apply Eriri patches
        shell: zsh {0}
        run: |
          set -euo pipefail
          setopt null_glob
          patches=(patches/*.patch)
          (( ${#patches} )) || { echo "no patches in patches/"; exit 1; }
          git config user.email "eriri-ci@localhost"
          git config user.name "Eriri CI"
          echo "applying: ${patches[@]}"
          if ! git am "${patches[@]}"; then
            git am --abort || true
            echo "Applying the patches failed, aborting git-am" >&2
            exit 1
          fi

      # Fetch the contribs built once by the "Build VLC contribs" workflow from
      # its release asset with gh (authenticated, follows the asset redirect,
      # and keeps working if the repo ever turns private) instead of a bare
      # public URL. The local file is handed to build.sh's native
      # prebuilt-contribs mechanism as a file:// URL. If the release does not
      # exist yet, the build falls back to building the contribs inline.
      - name: Fetch prebuilt contribs
        id: prebuilt
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CKEY="$(git rev-parse HEAD:contrib | cut -c1-12)"
          BKEY="$(shasum -a 256 eriri/contrib.conf | cut -c1-8)"
          TAG="contrib-${{ env.ARCH }}-${{ env.SDK }}-${CKEY}-${BKEY}"
          D="$RUNNER_TEMP/prebuilt-contribs"
          rm -rf "$D"; mkdir -p "$D"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
               -p 'vlc-contrib-*.tar.zst' -D "$D"; then
            F="$(ls "$D"/vlc-contrib-*.tar.zst | head -1)"
            echo "url=file://$F" >> "$GITHUB_OUTPUT"
            echo "hit=1" >> "$GITHUB_OUTPUT"
            echo "prebuilt contribs: $TAG -> $F"
          else
            echo "hit=0" >> "$GITHUB_OUTPUT"
            echo "no release '$TAG' yet; contribs will be built inline"
          fi

      # --------------------------------------------------------------- caches
      # Contribs are NOT cached here; they are built once by the "Build VLC
      # contribs" workflow and consumed as a release asset through
      # --with-prebuilt-contribs (see the fetch step above), with an inline
      # build as fallback.
      # 1) extras/tools (autoconf, pkg-config, cmake, meson, ...). Small but slow.
      - name: Restore VLC build tools
        id: cache-tools
        uses: actions/cache/restore@v4
        with:
          path: extras/tools/build
          key: ${{ runner.os }}-vlc-tools-${{ hashFiles('extras/tools/bootstrap', 'extras/tools/Makefile.am', 'extras/tools/tools.mak') }}
          restore-keys: |
            ${{ runner.os }}-vlc-tools-

      # 2) Incremental VLC compile tree. The key carries a fingerprint of the
      #    configure inputs: a flag change (the deployment target, a module
      #    option) does not touch any source file, so make would happily reuse
      #    objects built with the previous flags and the SDK would silently
      #    advertise the old value. Patch edits still reuse the tree, because
      #    those do move file timestamps.
      - name: Restore VLC build
        id: cache-build
        uses: actions/cache/restore@v4
        with:
          path: build-dir/build
          key: ${{ runner.os }}-vlc-build-${{ env.ARCH }}-${{ hashFiles('eriri/vlc.conf', 'eriri/contrib.conf', 'extras/package/apple/build.conf') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-vlc-build-${{ env.ARCH }}-${{ hashFiles('eriri/vlc.conf', 'eriri/contrib.conf', 'extras/package/apple/build.conf') }}-

      # 3) ccache (wired in via VLC_CCACHE_BINS_PATH below).
      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ env.ARCH }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.ARCH }}-

      # ------------------------------------------------------------ toolchain
      - name: Prepare toolchain (GNU make 4.4 + ccache)
        shell: zsh {0}
        run: |
          set -euo pipefail
          brew install make ccache ninja

          # The whole build (extras/tools bootstrap, contribs, VLC) must use
          # GNU make 4.4. Apple's make 3.81 uses a pipe jobserver whose fds are
          # not inherited through cmake into ninja, which then dies with
          # "Could not initialize jobserver: Invalid file descriptors".
          # GNU make 4.4 uses a FIFO jobserver that ninja understands, and
          # extras/tools/bootstrap picks its ninja variant based on `make -v`.
          #
          # VLC only injects $VLC_PATH into PATH inside vlcSetBaseEnvironment(),
          # which runs at configure time — after the tools/contrib phases. So
          # also prepend it via GITHUB_PATH so make resolves to 4.4 everywhere.
          GNUBIN="$(brew --prefix make)/libexec/gnubin"
          mkdir -p "$RUNNER_TEMP/vlc-tools"
          ln -sf "$GNUBIN/make" "$RUNNER_TEMP/vlc-tools/make"
          echo "VLC_PATH=$RUNNER_TEMP/vlc-tools" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vlc-tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vlc-tools/make" --version | head -1
          "$(brew --prefix ninja)/bin/ninja" --version

          # pkg-config is the brew one, so its pkg.m4 lives in the formula's
          # aclocal dir. VLC's own aclocal does not search it, and contribs
          # that run autoreconf (e.g. lame) then fail with
          #   configure: syntax error near unexpected token `SNDFILE,'
          # because PKG_CHECK_MODULES is left unexpanded. contrib/src/main.mak
          # appends $ACLOCAL_PATH, so exporting it here fixes that.
          echo "ACLOCAL_PATH=$(brew --prefix)/share/aclocal" >> "$GITHUB_ENV"

          # The cached contrib build tree carries stamps for tools installed
          # outside the tree (cargo-c lands in ~/.cargo/bin). If that binary is
          # missing, drop the stamp so contrib rebuilds it instead of invoking
          # a tool that is not there ("cargo: no such command: capi").
          if ! command -v cargo-capi >/dev/null 2>&1; then
            find contrib \( -name '.cargo-c' -o -name '.dep-cargo-c' \) -delete 2>/dev/null || true
          fi

          # ccache is picked up natively via VLC_CCACHE_BINS_PATH; the wrapper
          # names must be exactly cc / c++.
          CCACHE_BIN="$(brew --prefix ccache)/bin/ccache"
          mkdir -p "$RUNNER_TEMP/ccache-bins"
          ln -sf "$CCACHE_BIN" "$RUNNER_TEMP/ccache-bins/cc"
          ln -sf "$CCACHE_BIN" "$RUNNER_TEMP/ccache-bins/c++"
          echo "VLC_CCACHE_BINS_PATH=$RUNNER_TEMP/ccache-bins" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          "$CCACHE_BIN" --version | head -1

      # ---------------------------------------------------------------- build
      - name: Build macOS SDK (static)
        shell: zsh {0}
        run: |
          set -euo pipefail
          mkdir -p build-dir
          cd build-dir
          # Only ask build.sh for prebuilt contribs when the release asset was
          # actually fetched; otherwise it builds them inline.
          PREBUILT=()
          if [ "${{ steps.prebuilt.outputs.hit }}" = "1" ]; then
            PREBUILT=(--with-prebuilt-contribs
                      "VLC_PREBUILT_CONTRIBS_URL=${{ steps.prebuilt.outputs.url }}")
          fi
          # No --enable-shared: this is the static build, which is what lets the
          # SDK ship one libvlc.framework instead of a directory of plugins.
          ../extras/package/apple/build.sh \
            --arch=${{ env.ARCH }} \
            --sdk=${{ env.SDK }} \
            --config="$GITHUB_WORKSPACE/eriri/build.conf" \
            "${PREBUILT[@]}"

      # A static SDK carries every plugin inside lib/libvlc-full-static.a. Link
      # it into one libvlc.framework so the app maps a single file at startup
      # and needs no plugin directory. There is no plugin cache to generate
      # either: nothing is dlopen()ed per plugin any more, which is exactly the
      # ~5 s startup storm the cache used to paper over.
      - name: Assemble libvlc.xcframework
        shell: zsh {0}
        run: |
          set -euo pipefail
          SDK="build-dir/${{ env.SDK_DIR }}"
          ./eriri/make-vlc-framework.sh "$SDK"
          echo "--- SDK lib/ ---"; ls -la "$SDK/lib"
          BIN="$SDK/lib/libvlc.xcframework/macos-arm64/libvlc.framework/Versions/A/libvlc"
          echo "--- framework binary ---"; ls -la "$BIN"
          echo "--- unwind tables (must include __unwind_info) ---"
          otool -l "$BIN" | grep -E 'sectname __(unwind_info|eh_frame)' || true
          echo "--- deployment target ---"
          otool -l "$BIN" | awk '/minos/ { print "  minos " $2; exit }'
          echo "--- exports ---"
          printf '  libvlc_ symbols: %s\n' "$(nm -gU "$BIN" | grep -c '_libvlc_')"
          printf '  module table:    %s\n' "$(nm "$BIN" | grep -c ' _vlc_static_modules$')"

      - name: Show ccache stats
        if: always()
        shell: zsh {0}
        run: ccache -s || true

      # --------------------------------------------------------------- verify
      - name: Verify SDK
        shell: zsh {0}
        run: |
          set -euo pipefail
          SDK="build-dir/${{ env.SDK_DIR }}"
          XCF="$SDK/lib/libvlc.xcframework"
          SLICE="$XCF/macos-arm64/libvlc.framework"
          BIN="$SLICE/Versions/A/libvlc"
          if [ ! -d "$SDK" ]; then echo "missing SDK dir: $SDK"; ls -la build-dir; exit 1; fi
          test -f "$SDK/include/vlc/libvlc.h" || { echo "missing public headers"; exit 1; }
          test -d "$XCF" || { echo "missing $XCF"; ls -la "$SDK/lib"; exit 1; }
          test -f "$BIN" || { echo "missing framework binary: $BIN"; ls -la "$SDK/lib"; exit 1; }
          test -f "$SLICE/Versions/A/Modules/module.modulemap" \
            || { echo "missing framework modulemap"; exit 1; }

          # The framework must advertise the deployment target the SDK was built
          # for, not the build machine's OS: without -mmacosx-version-min clang
          # silently uses the host SDK's default.
          WANT=$(grep -m1 'VLC_DEPLOYMENT_TARGET_MACOSX=' eriri/contrib.conf | sed 's/.*"\(.*\)"/\1/')
          GOT=$(otool -l "$BIN" | awk '/minos/ { print $2; exit }')
          echo "deployment target: framework $GOT, SDK $WANT"
          [ "$GOT" = "$WANT" ] \
            || { echo "framework minos $GOT does not match the SDK target $WANT"; exit 1; }

          # The app links -lvlc and -lvlccore against lib/, so both names must
          # still resolve even though only one binary exists.
          for n in libvlc.dylib libvlccore.dylib; do
            test -e "$SDK/lib/$n" || { echo "missing $n"; exit 1; }
          done

          # No plugin directory: every plugin lives inside the framework.
          test ! -d "$SDK/lib/vlc/plugins" \
            || { echo "unexpected plugin directory in a static build"; exit 1; }

          # The whole point of the framework link: keep the compact unwind table
          # so C++ exceptions raised in a plugin can unwind into their handler.
          otool -l "$BIN" | grep -q 'sectname __unwind_info' \
            || { echo "framework has no __unwind_info: plugin C++ exceptions would abort"; exit 1; }

          api=$(nm -gU "$BIN" | grep -c '_libvlc_' || true)
          mods=$(nm "$BIN" | grep -c ' _vlc_static_modules$' || true)
          entries=$(nm "$BIN" | grep -c '_vlc_entry_' || true)
          echo "exported libvlc_ symbols: $api"
          echo "vlc_static_modules:       $mods"
          echo "plugin entry points:      $entries"
          [ "$api" -gt 100 ] || { echo "too few exported libvlc symbols"; exit 1; }
          [ "$mods" -ge 1 ] || { echo "module table not linked in"; exit 1; }
          [ "$entries" -gt 300 ] || { echo "too few plugin entry points"; exit 1; }

          echo "--- framework ---"; ls -la "$SLICE/Versions/A"
          echo "--- xcframework ---"; plutil -p "$XCF/Info.plist"
          echo "--- otool -L framework binary ---"; otool -L "$BIN" | head -8
          echo "--- headers ---"; ls "$SLICE/Versions/A/Headers/vlc" | head -5

      - name: Package SDK
        shell: zsh {0}
        run: |
          set -euo pipefail
          SDK="build-dir/${{ env.SDK_DIR }}"
          OUT="${{ env.JOB_NAME }}-${{ env.ARCH }}-${{ steps.rev.outputs.sha }}.tar.xz"
          # The framework already holds every plugin. The archives that were only
          # inputs to that link are ~1.2 GB of dead weight in the SDK.
          rm -f "$SDK/lib/libvlc-full-static.a" \
                "$SDK/lib/vlc/libvlc_static_modules.a" \
                "$SDK/lib/vlc/libvlc_static_modules.la"
          tar -C "$(dirname "$SDK")" -cJf "$OUT" "$(basename "$SDK")"
          shasum -a 256 "$OUT" | tee "$OUT.sha256"
          echo "SDK_ARCHIVE=$OUT" >> "$GITHUB_ENV"
          du -sh "$SDK"

      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JOB_NAME }}-${{ env.ARCH }}
          path: |
            ${{ env.JOB_NAME }}-${{ env.ARCH }}-*.tar.xz
            ${{ env.JOB_NAME }}-${{ env.ARCH }}-*.tar.xz.sha256
          if-no-files-found: error

      # ----------------------------------------------------------------- save
      # Save even when the build failed, so a red run does not force a full
      # rebuild next time (mirrors the VLCKit workflow). continue-on-error
      # guards the rare "cache already exists" race.
      - name: Save VLC build tools
        if: always() && steps.cache-tools.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: extras/tools/build
          key: ${{ runner.os }}-vlc-tools-${{ hashFiles('extras/tools/bootstrap', 'extras/tools/Makefile.am', 'extras/tools/tools.mak') }}

      - name: Save VLC build
        if: always() && steps.cache-build.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build-dir/build
          key: ${{ runner.os }}-vlc-build-${{ env.ARCH }}-${{ hashFiles('eriri/vlc.conf', 'eriri/contrib.conf', 'extras/package/apple/build.conf') }}-${{ github.run_id }}

      - name: Save ccache
        if: always() && steps.cache-ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ env.ARCH }}-${{ github.run_id }}
