# Eriri VLC build configuration (entry point).
#
# Split on purpose: the prebuilt-contrib release asset is keyed on the
# contrib-relevant inputs only (eriri/contrib.conf), so changing a VLC option
# in eriri/vlc.conf does not invalidate the expensive contrib build.
#
#   eriri/contrib.conf : deployment targets + VLC_CONTRIB_OPTIONS_*  -> affects contribs
#   eriri/vlc.conf     : VLC_CONFIG_OPTIONS_* + module removal lists -> affects VLC only
#
# build.sh sources this file via:
#   extras/package/apple/build.sh ... --config=<repo>/eriri/build.conf

_eriri_conf_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
. "${_eriri_conf_dir}/contrib.conf"
. "${_eriri_conf_dir}/vlc.conf"
