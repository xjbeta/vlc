# Eriri: VLC-side build options. These do NOT affect the contrib artifact
# (which is keyed on eriri/contrib.conf), so edits here never rebuild contribs.
#
# VLC options
#

# Base configure options for VLC
export VLC_CONFIG_OPTIONS_BASE=(
    --disable-sse
    --disable-vcd
    --disable-macosx
    --disable-macosx-avfoundation
    --enable-lua
    --disable-qt
    --disable-skins2
    --disable-vlc
    --disable-vlm
    --disable-nls
    --disable-notify
    --disable-projectm
    --disable-goom
    --enable-dvdread
    --enable-dvdnav
    --enable-bluray
    --disable-linsys
    --disable-libva
    --enable-gme
    --enable-tremor
    --disable-fluidsynth
    --disable-jack
    --disable-pulse
    --disable-mtp
    --enable-screen
    --disable-sparkle
    --disable-addonmanagermodules
    --enable-mad
)

# Additional configure options for macOS
export VLC_CONFIG_OPTIONS_MACOSX=()

# Additional configure options for iOS
export VLC_CONFIG_OPTIONS_IOS=(
    --disable-upnp-server
)

# Additional configure options for tvOS
export VLC_CONFIG_OPTIONS_TVOS=(
    --disable-upnp-server
)

# Additional configure options for xrOS
export VLC_CONFIG_OPTIONS_XROS=(
    --disable-upnp-server
)

# Additional configure options for watchOS
export VLC_CONFIG_OPTIONS_WATCHOS=(
    --disable-chromecast
    --disable-sout
    --disable-css
    --disable-upnp-server
)

