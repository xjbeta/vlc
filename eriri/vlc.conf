# Eriri: VLC-side build options. These do NOT affect the contrib artifact
# (which is keyed on eriri/contrib.conf), so edits here never rebuild contribs.
#
# VLC options
#

# Base configure options for VLC
export VLC_CONFIG_OPTIONS_BASE=(
    --disable-sse
    --disable-vcd
    --disable-macosx
    --disable-macosx-avfoundation
    --enable-lua
    --disable-qt
    --disable-skins2
    # Eriri: upstream's Apple base options disable this, but the medialibrary
    # browses directories through the out-of-process preparser, which lives in
    # libexec/vlc/vlc-preparser and is only built when BUILD_VLC is true
    # (bin/preparser/Makefile.am). VLC's own macOS SDK builds it, and without it
    # discovery fails with "Failed to browse directory" / "Fail to create
    # Process in process_pool".
    --enable-vlc
    --disable-vlm
    --disable-nls
    --disable-notify
    --disable-projectm
    --disable-goom
    --enable-dvdread
    --enable-dvdnav
    --enable-bluray
    --disable-linsys
    --disable-libva
    --enable-gme
    --enable-tremor
    --disable-fluidsynth
    --disable-jack
    --disable-pulse
    --disable-mtp
    # Eriri: the libdsm plugin ships two modules - the SMB1 'cifs' access and the
    # 'dsm-sd' NETBIOS services-discovery. VLC's medialibrary unconditionally
    # enables network discovery with a hardcoded "smb://" device lister
    # (modules/misc/medialibrary/medialibrary.cpp), so 'dsm-sd' is opened on every
    # launch and libdsm's BDSM_dbg() fprintf()s "Sending netbios packet to
    # <broadcast>" to stderr every 6s (BROADCAST_TIMEOUT in modules/access/dsm/sd.c),
    # bypassing libvlc logging entirely. Without dsm, smb:// falls through to
    # libsmb2 (SMB2/3) - what the official macOS SDK does anyway; only SMB1-only
    # hosts and bare NetBIOS names lose their resolution path.
    --disable-dsm
    --enable-screen
    --disable-sparkle
    --disable-addonmanagermodules
    --enable-mad
)

# Additional configure options for macOS
# Eriri: force the medialibrary module on (upstream's Apple config only gates
# the contrib; the VLC side is 'auto'). Explicit --enable makes configure fail
# loudly if the contrib is missing, instead of silently shipping without it.
export VLC_CONFIG_OPTIONS_MACOSX=(
    --enable-medialibrary
)

# Additional configure options for iOS
export VLC_CONFIG_OPTIONS_IOS=(
    --disable-upnp-server
)

# Additional configure options for tvOS
export VLC_CONFIG_OPTIONS_TVOS=(
    --disable-upnp-server
)

# Additional configure options for xrOS
export VLC_CONFIG_OPTIONS_XROS=(
    --disable-upnp-server
)

# Additional configure options for watchOS
export VLC_CONFIG_OPTIONS_WATCHOS=(
    --disable-chromecast
    --disable-sout
    --disable-css
    --disable-upnp-server
)

