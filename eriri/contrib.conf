# Copyright (C) Marvin Scholz
#
# This is a configuration file with various
# variables used by the build.sh script.
#
# This is just a bash script and sourced in
# build.sh, so keep that in mind when editing!
#
# ---------------------------------------------------------------------------
# Eriri-specific copy. We do NOT modify upstream
# extras/package/apple/build.conf; the CI passes this file via
#   extras/package/apple/build.sh --config=<repo>/eriri/build.conf
# Differences from upstream: macOS 12.0 deployment target, GPL/GPLv3
# contribs enabled (Eriri is GPLv3), and playback features turned back on
# (Lua, optical discs, SRT, screen capture, extra audio codecs) while the
# VLC GUI stays disabled.
# ---------------------------------------------------------------------------

#
# General options
#

# macOS deployment target
export VLC_DEPLOYMENT_TARGET_MACOSX="12.0"
# iOS deployment target
export VLC_DEPLOYMENT_TARGET_IOS="9.0"
export VLC_DEPLOYMENT_TARGET_IOS_SIMULATOR="12.0"
# tvOS deployment target
export VLC_DEPLOYMENT_TARGET_TVOS="11.0"
export VLC_DEPLOYMENT_TARGET_TVOS_SIMULATOR="12.0"
# xrOS deployment target
export VLC_DEPLOYMENT_TARGET_XROS="1.0"
# watchOS deployment target
export VLC_DEPLOYMENT_TARGET_WATCHOS="7.5"

#
# Contrib options
#

# Base contrib bootstrap options used on all OSes
export VLC_CONTRIB_OPTIONS_BASE=(
    --enable-ad-clauses
    --disable-iconv
    --enable-zvbi
    --disable-caca
    --disable-gettext
    --enable-vorbis
    --disable-goom
    --disable-vncserver
    --enable-fribidi
    --enable-libxml2
    --enable-freetype2
    --enable-ass
    --disable-fontconfig
    --disable-vncclient
    --disable-gnutls
    --enable-vpx
    --enable-libdsm
    --enable-libplacebo
    --disable-sparkle
    --disable-breakpad
    --disable-ncurses
    --disable-asdcplib
    --enable-soxr
    --enable-taglib
    --disable-medialibrary
    --disable-decklink
)

# Additional contrib bootstrap options for macOS
export VLC_CONTRIB_OPTIONS_MACOSX=(
    --disable-twolame
    --disable-microdns
)

# Additional contrib bootstrap options for iOS
export VLC_CONTRIB_OPTIONS_IOS=(
    --disable-aom
)

# Additional contrib bootstrap options for tvOS
export VLC_CONTRIB_OPTIONS_TVOS=(
    --disable-libarchive
    --disable-aom
)

# Additional contrib bootstrap options for iOS
export VLC_CONTRIB_OPTIONS_XROS=(
    --disable-aom
)

export VLC_CONTRIB_OPTIONS_WATCHOS=(
    --disable-gpl
    --disable-gnuv3
    --enable-ad-clauses
    --disable-all
    --enable-dvbpsi
    --enable-ebml
    --enable-ffmpeg
    --enable-flac
    --enable-gsm
    --enable-matroska
    --enable-modplug
    --enable-mysofa
    --enable-ogg
    --enable-opus
    --enable-rnnoise
    --enable-soxr
    --enable-spatialaudio
    --enable-speex
    --enable-speexdsp
    --enable-taglib
    --enable-vorbis
    --enable-zlib
)

